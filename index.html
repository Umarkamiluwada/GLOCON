<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>GLOCON — Global Connect</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192-2.png">
<link rel="apple-touch-icon" href="icon-192-2.png">
<meta name="theme-color" content="#0a1220">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app">

  <!-- ===================== SPLASH ===================== -->
  <section id="screen-splash" class="screen active">
    <div class="splash-wrap">
      <img src="icon-192-2.png" alt="GLOCON" class="splash-icon">
      <div class="splash-name">GLOCON</div>
    </div>
  </section>

  <!-- ===================== LOGIN ===================== -->
  <section id="screen-login" class="screen">
    <div class="auth-wrap">
      <div class="auth-logo">
        <img src="icon-192-2.png" alt="GLOCON">
        <div class="name">GLOCON</div>
        <div class="tag" data-i18n="tagline">Global Connect — People · Communities · Opportunities</div>
      </div>
      <div id="login-error" class="error-box"></div>
      <div class="field">
        <label data-i18n="email">Email</label>
        <input type="email" id="login-email" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label data-i18n="password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" id="login-btn" data-i18n="login">Log In</button>
      <div class="auth-switch">
        <span data-i18n="no_account">Don't have an account?</span>
        <button id="go-signup" data-i18n="signup">Sign Up</button>
      </div>
    </div>
  </section>

  <!-- ===================== SIGNUP ===================== -->
  <section id="screen-signup" class="screen">
    <div class="auth-wrap">
      <div class="auth-logo">
        <img src="icon-192-2.png" alt="GLOCON">
        <div class="name">GLOCON</div>
        <div class="tag" data-i18n="create_account">Create your account</div>
      </div>
      <div id="signup-error" class="error-box"></div>

      <div class="field">
        <label data-i18n="language">Language / Langue / اللغة / Harshe</label>
        <select id="su-language">
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="ha">Hausa</option>
          <option value="ar">العربية (Arabic)</option>
        </select>
      </div>

      <div class="field">
        <label data-i18n="country">Country</label>
        <select id="su-country">
          <option value="">-- select --</option>
          <option value="Nigeria" selected>Nigeria</option>
              <option value="Afghanistan">Afghanistan</option>
              <option value="Algeria">Algeria</option>
              <option value="Argentina">Argentina</option>
              <option value="Australia">Australia</option>
              <option value="Austria">Austria</option>
              <option value="Bangladesh">Bangladesh</option>
              <option value="Belgium">Belgium</option>
              <option value="Benin">Benin</option>
              <option value="Brazil">Brazil</option>
              <option value="Burkina Faso">Burkina Faso</option>
              <option value="Cameroon">Cameroon</option>
              <option value="Canada">Canada</option>
              <option value="Chad">Chad</option>
              <option value="Chile">Chile</option>
              <option value="China">China</option>
              <option value="Colombia">Colombia</option>
              <option value="Democratic Republic of Congo">Democratic Republic of Congo</option>
              <option value="Egypt">Egypt</option>
              <option value="Ethiopia">Ethiopia</option>
              <option value="France">France</option>
              <option value="Gabon">Gabon</option>
              <option value="Gambia">Gambia</option>
              <option value="Germany">Germany</option>
              <option value="Ghana">Ghana</option>
              <option value="Guinea">Guinea</option>
              <option value="India">India</option>
              <option value="Indonesia">Indonesia</option>
              <option value="Iran">Iran</option>
              <option value="Iraq">Iraq</option>
              <option value="Italy">Italy</option>
              <option value="Ivory Coast">Ivory Coast</option>
              <option value="Japan">Japan</option>
              <option value="Jordan">Jordan</option>
              <option value="Kenya">Kenya</option>
              <option value="Kuwait">Kuwait</option>
              <option value="Lebanon">Lebanon</option>
              <option value="Liberia">Liberia</option>
              <option value="Libya">Libya</option>
              <option value="Malaysia">Malaysia</option>
              <option value="Mali">Mali</option>
              <option value="Mauritania">Mauritania</option>
              <option value="Mexico">Mexico</option>
              <option value="Morocco">Morocco</option>
              <option value="Netherlands">Netherlands</option>
              <option value="Niger">Niger</option>
              <option value="Nigeria">Nigeria</option>
              <option value="Pakistan">Pakistan</option>
              <option value="Philippines">Philippines</option>
              <option value="Qatar">Qatar</option>
              <option value="Russia">Russia</option>
              <option value="Rwanda">Rwanda</option>
              <option value="Saudi Arabia">Saudi Arabia</option>
              <option value="Senegal">Senegal</option>
              <option value="Sierra Leone">Sierra Leone</option>
              <option value="Somalia">Somalia</option>
              <option value="South Africa">South Africa</option>
              <option value="South Korea">South Korea</option>
              <option value="Spain">Spain</option>
              <option value="Sudan">Sudan</option>
              <option value="Sweden">Sweden</option>
              <option value="Switzerland">Switzerland</option>
              <option value="Syria">Syria</option>
              <option value="Tanzania">Tanzania</option>
              <option value="Thailand">Thailand</option>
              <option value="Togo">Togo</option>
              <option value="Tunisia">Tunisia</option>
              <option value="Turkey">Turkey</option>
              <option value="Uganda">Uganda</option>
              <option value="Ukraine">Ukraine</option>
              <option value="United Arab Emirates">United Arab Emirates</option>
              <option value="United Kingdom">United Kingdom</option>
              <option value="United States">United States</option>
              <option value="Yemen">Yemen</option>
              <option value="Zambia">Zambia</option>
              <option value="Zimbabwe">Zimbabwe</option>
        </select>
      </div>

      <div class="field-row">
        <div class="field">
          <label data-i18n="first_name">First name</label>
          <input type="text" id="su-first-name" autocomplete="given-name">
        </div>
        <div class="field">
          <label data-i18n="last_name">Last name</label>
          <input type="text" id="su-last-name" autocomplete="family-name">
        </div>
      </div>

      <div class="field">
        <label data-i18n="username">Username</label>
        <input type="text" id="su-username" autocomplete="off" placeholder="e.g. umarkw">
      </div>

      <div class="field">
        <label data-i18n="email">Email</label>
        <input type="email" id="su-email" autocomplete="email" placeholder="you@example.com">
      </div>

      <div class="field">
        <label data-i18n="phone">Phone number</label>
        <input type="tel" id="su-phone" autocomplete="tel" placeholder="+234...">
      </div>

      <div class="field">
        <label data-i18n="password">Password</label>
        <input type="password" id="su-password" autocomplete="new-password">
      </div>

      <div class="field">
        <label data-i18n="confirm_password">Confirm password</label>
        <input type="password" id="su-confirm-password" autocomplete="new-password">
      </div>

      <button class="btn btn-primary" id="signup-btn" data-i18n="signup">Sign Up</button>
      <div class="auth-switch">
        <span data-i18n="have_account">Already have an account?</span>
        <button id="go-login" data-i18n="login">Log In</button>
      </div>
    </div>
  </section>

  <!-- ===================== FEED ===================== -->
  <section id="screen-feed" class="screen">
    <div class="topbar">
      <div class="topbar-title"><span class="g">GLOCON</span></div>
      <button class="topbar-back" data-nav="notifications" style="position:relative;">
        🔔<span id="notif-badge" class="count-badge hidden">0</span>
      </button>
    </div>
    <div id="feed-list" style="margin-top:8px;"></div>
  </section>

  <!-- ===================== NOTIFICATIONS ===================== -->
  <section id="screen-notifications" class="screen">
    <div class="topbar">
      <button class="topbar-back" data-nav="feed">‹</button>
      <div class="topbar-title" style="font-size:17px;" data-i18n="notifications">Notifications</div>
      <div style="width:24px;"></div>
    </div>
    <div id="notifications-list"></div>
  </section>

  <!-- ===================== CREATE POST ===================== -->
  <section id="screen-create" class="screen">
    <div class="topbar">
      <button class="topbar-back" data-nav="feed">‹</button>
      <div class="topbar-title" style="font-size:17px;" data-i18n="create_post">Create Post</div>
      <div style="width:24px;"></div>
    </div>
    <div style="margin-top:8px;">
      <div class="composer">
        <div class="avatar" id="create-avatar"></div>
        <textarea id="post-caption" data-i18n-ph="whats_on_mind" placeholder="What's on your mind?"></textarea>
      </div>
      <input type="file" id="post-photo-input" accept="image/*" style="display:none;">
      <div class="photo-picker" id="photo-picker-btn" data-i18n="add_photo">📷 Add a photo</div>
      <div class="photo-preview-wrap" id="photo-preview-wrap" style="display:none;">
        <img class="photo-preview" id="photo-preview">
        <button class="photo-remove" id="photo-remove">✕</button>
      </div>
      <button class="btn btn-primary" id="publish-btn" data-i18n="post">Post</button>
    </div>
  </section>

  <!-- ===================== PROFILE ===================== -->
  <section id="screen-profile" class="screen">
    <div class="topbar">
      <div class="topbar-title" style="font-size:17px;" data-i18n="profile">Profile</div>
      <button class="topbar-back" id="logout-btn" title="Log out" data-i18n-title="logout">⎋</button>
    </div>
    <div class="profile-head">
      <div class="profile-avatar-wrap">
        <div class="avatar" id="profile-avatar" style="width:92px;height:92px;font-size:30px;"></div>
        <button class="avatar-edit-btn" id="avatar-edit-btn">✎</button>
        <input type="file" id="avatar-input" accept="image/*" style="display:none;">
      </div>
      <div class="profile-name" id="profile-name">—</div>
      <div class="profile-username" id="profile-username">@—</div>
      <div class="profile-meta" id="profile-meta">—</div>
      <div class="profile-stats">
        <div class="stat"><div class="num" id="stat-posts">0</div><div class="label" data-i18n="posts">Posts</div></div>
        <div class="stat"><div class="num" id="stat-followers">0</div><div class="label" data-i18n="followers">Followers</div></div>
        <div class="stat"><div class="num" id="stat-following">0</div><div class="label" data-i18n="following">Following</div></div>
        <div class="stat"><div class="num" id="stat-friends">0</div><div class="label" data-i18n="friends">Friends</div></div>
      </div>
    </div>
    <div class="section-title" data-i18n="your_posts">Your Posts</div>
    <div id="profile-posts"></div>
  </section>

  <!-- ===================== CHAT LIST ===================== -->
  <section id="screen-chat" class="screen">
    <div class="topbar">
      <div class="topbar-title" style="font-size:17px;" data-i18n="chat">Chat</div>
      <button class="topbar-back" id="new-chat-btn" title="New chat">➕</button>
    </div>
    <div class="new-chat-box hidden" id="new-chat-box">
      <input type="text" id="new-chat-search" data-i18n-ph="search_by_username" placeholder="Search by username…">
      <div id="new-chat-results"></div>
    </div>
    <div id="conversation-list"></div>
  </section>

  <!-- ===================== CHAT CONVERSATION ===================== -->
  <section id="screen-conversation" class="screen">
    <div class="topbar">
      <button class="topbar-back" data-nav="chat">‹</button>
      <div class="conv-header-block">
        <div class="topbar-title" id="conversation-name" style="font-size:16px;">—</div>
        <div id="conversation-status" class="conv-status hidden"></div>
      </div>
      <div style="width:24px;"></div>
    </div>
    <div id="messages-list" class="messages-list"></div>
    <div class="message-compose">
      <input type="text" id="message-input" data-i18n-ph="type_message" placeholder="Type a message…">
      <button id="message-send">➤</button>
    </div>
  </section>

  <!-- ===================== BOTTOM NAV ===================== -->
  <div class="bottom-nav" id="bottom-nav">
    <button data-nav="feed"><span class="ic">🏠</span><span data-i18n="home">Home</span></button>
    <button data-nav="chat"><span class="ic">💬<span id="chat-badge" class="nav-badge hidden"></span></span><span data-i18n="chat">Chat</span></button>
    <button data-nav="create"><span class="ic">➕</span><span data-i18n="post">Post</span></button>
    <button data-nav="profile"><span class="ic">👤</span><span data-i18n="profile">Profile</span></button>
  </div>

  <div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
    <div class="msg" id="loading-msg">Please wait…</div>
  </div>
  <div class="toast" id="toast"></div>

</div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
